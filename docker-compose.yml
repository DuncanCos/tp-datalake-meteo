name: datalake-meteo

x-airflow-common: &airflow-common
  build: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # format JSON : le host doit contenir le schema spark://, sinon le
    # SparkSubmitOperator construit un master URL invalide
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    AIRFLOW_CONN_WEBHDFS_DEFAULT: http://namenode:9870
    KAFKA_BOOTSTRAP: kafka:19092
    HDFS_NAMENODE: hdfs://namenode:8020
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark:/opt/airflow/spark
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ──────────────────────────── HDFS ────────────────────────────
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    # root : les volumes nommes sont crees root et l'utilisateur hadoop ne peut pas y ecrire
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # UI + WebHDFS
      - "8020:8020"   # RPC
    env_file: ./docker/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    volumes:
      - namenode_data:/tmp/hadoop-root
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file: ./docker/hadoop.env
    volumes:
      - datanode_data:/tmp/hadoop-root
    depends_on:
      - namenode
    restart: unless-stopped

  # ──────────────────────────── Kafka ───────────────────────────
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"   # accès depuis la machine hôte
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: datalake
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
    restart: unless-stopped

  # ──────────────────────────── Spark ───────────────────────────
  spark-master:
    image: spark:3.5.1
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8082:8080"   # UI master
      - "7077:7077"
    restart: unless-stopped

  spark-worker:
    image: spark:3.5.1
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    restart: unless-stopped

  # ─────────────────────────── Airflow ──────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # job streaming continu : Kafka -> Bronze HDFS (relance auto apres crash,
  # reprise via checkpoint HDFS). root pour pouvoir ecrire le cache ivy (volume).
  streaming-bronze:
    image: spark:3.5.1
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.cores.max=1
      - /opt/jobs/streaming_bronze.py
    volumes:
      - ./spark:/opt/jobs
      - spark_ivy:/tmp/ivy
    depends_on:
      - spark-master
      - spark-worker
      - kafka
      - namenode
    restart: unless-stopped

  # ─────────────────────────── Producer ─────────────────────────
  producer:
    build: ./docker/producer
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: weather.current
      POLL_INTERVAL_SECONDS: "30"
    volumes:
      - ./producer:/app
    depends_on:
      - kafka
    restart: unless-stopped

  # ─────────────────────────── Site web ─────────────────────────
  webapp:
    build: ./docker/webapp
    ports:
      - "8090:8000"
    environment:
      WEBHDFS_URL: http://namenode:9870
    volumes:
      - ./webapp:/app
    depends_on:
      - namenode
    restart: unless-stopped

  # ──────────────────── Observabilité (metrics) ─────────────────
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:19092"]
    depends_on:
      - kafka
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  # ───────────────────── Observabilité (logs) ───────────────────
  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  postgres_data:
  airflow_logs:
  spark_ivy:
  prometheus_data:
  grafana_data:
  loki_data:
